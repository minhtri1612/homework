# Runs the tests on every push and pull request. On a push to main (or the
# "Run workflow" button) it then builds the Docker image and pushes it to
# Docker Hub as :latest and :<commit SHA>.
# Needs the repository secret DOCKERHUB_TOKEN (a Docker Hub access token with
# Read & Write permission for the account below).
name: Tests and Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: minhtri16122004
  IMAGE: minhtri16122004/homework

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
